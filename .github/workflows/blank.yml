name: Hizli Turkiye EPG (Gist)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  epg-uret:
    runs-on: ubuntu-latest
    steps:
      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kaziyiciyi Hizli Hazirla
        run: |
          DOMAIN="github.com"
          REPO_PATH="iptv-org/epg.git"
          git clone --depth 1 --single-branch "https://${DOMAIN}/${REPO_PATH}" epg_tool >/dev/null 2>&1
          cd epg_tool
          npm install --omit=dev --no-audit --no-fund --silent >/dev/null 2>&1

      - name: Kaynak Bazli EPG Cek ve Birlestir
        run: |
          cd epg_tool
          mkdir -p ../kaynak_ciktilari

          for dosya in sites/*/*.channels.xml; do
            if grep -q 'lang="tr"' "$dosya"; then
              site_adi=$(basename "$(dirname "$dosya")")
              echo '<?xml version="1.0" encoding="UTF-8"?><channels>' > temp_ch.xml
              grep 'lang="tr"' "$dosya" | grep "<channel " >> temp_ch.xml || true
              echo '</channels>' >> temp_ch.xml

              kanal_sayisi=$(grep -c '<channel ' temp_ch.xml || true)
              if [ "$kanal_sayisi" -gt 0 ]; then
                npm run grab -- --channels=temp_ch.xml --output="../kaynak_ciktilari/${site_adi}.xml" --days=2 --maxConnections=15 --timeout=15000 >/dev/null 2>&1 || true
                
                if [ -f "../kaynak_ciktilari/${site_adi}.xml" ]; then
                  prog_sayisi=$(grep -c '<programme ' "../kaynak_ciktilari/${site_adi}.xml" || true)
                  aktif_ch=$(grep -o 'channel="[^"]*"' "../kaynak_ciktilari/${site_adi}.xml" | sort -u | wc -l || true)
                  echo "Kaynak: ${site_adi} -> ${aktif_ch} kanal, ${prog_sayisi} program geldi."
                else
                  echo "Kaynak: ${site_adi} -> 0 kanal, 0 program geldi."
                fi
              fi
            fi
          done

      - name: Sadelestir ve Tekillestir
        run: |
          python3 - << 'EOF'
          import glob, re, xml.etree.ElementTree as ET

          def ismi_sadelestir(isim):
              temiz = re.sub(r"\b(HD|FHD|UHD|4K|SD|HEVC|H265|RAW|TR|TURKEY|TV\+|\.tr)\b", "", isim, flags=re.IGNORECASE)
              temiz = re.sub(r"[\(\)\[\]\.\-_]", " ", temiz)
              return " ".join(temiz.split()).strip()

          ana_tv = ET.Element("tv", {"generator-info-name": "Sade-Turkiye-EPG"})
          aktif_kanallar = set()
          eklenen_programlar = set()
          toplam_program = 0

          for xml_dosya in glob.glob("kaynak_ciktilari/*.xml"):
              try:
                  kaynak_root = ET.parse(xml_dosya).getroot()
                  id_haritasi = {}

                  for ch in kaynak_root.findall("channel"):
                      eski_id = ch.get("id")
                      disp = ch.find("display-name")
                      ham_isim = disp.text if (disp is not None and disp.text) else eski_id
                      if ham_isim:
                          sade_ad = ismi_sadelestir(ham_isim)
                          if sade_ad:
                              id_haritasi[eski_id] = sade_ad

                  for prog in kaynak_root.findall("programme"):
                      eski_ch_id = prog.get("channel")
                      if eski_ch_id in id_haritasi:
                          sade_ad = id_haritasi[eski_ch_id]
                          baslangic = prog.get("start", "")
                          anahtar = (sade_ad, baslangic)
                          if anahtar not in eklenen_programlar:
                              eklenen_programlar.add(anahtar)
                              prog.set("channel", sade_ad)
                              ana_tv.append(prog)
                              aktif_kanallar.add(sade_ad)
                              toplam_program += 1
              except Exception:
                  pass

          for sade_ad in sorted(aktif_kanallar):
              yeni_ch = ET.SubElement(ana_tv, "channel", {"id": sade_ad})
              yeni_disp = ET.SubElement(yeni_ch, "display-name", {"lang": "tr"})
              yeni_disp.text = sade_ad

          tree = ET.ElementTree(ana_tv)
          tree.write("guide.xml", encoding="utf-8", xml_declaration=True)
          print(f"OZET -> Toplam benzersiz kanal: {len(aktif_kanallar)} | Toplam tekil program: {toplam_program}")
          EOF

      - name: Gist Guncelle
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          CLEAN_ID=$(echo "$GIST_ID" | awk -F'/' '{print $NF}' | tr -d '[:space:]')
          gh gist edit "$CLEAN_ID" guide.xml
