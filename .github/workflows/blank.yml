              "trt-world-yayin-akisi": ("TRTWorld.tr", "TRT World"),
              "kanal-d-yayin-akisi": ("KanalD.tr", "Kanal D"),
              "atv-yayin-akisi": ("ATV.tr", "ATV"),
              "a2-yayin-akisi": ("A2.tr", "A2"),
