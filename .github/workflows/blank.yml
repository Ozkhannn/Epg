name: Otomatik Gist Turkiye EPG

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  epg-uret:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: EPG Kaynaklarini Indir
        run: |
          mkdir -p epg_data
          curl -sL --max-time 60 -A "Mozilla/5.0" "http://epgshare01.online" -o epg_data/tr1.xml.gz || true
          curl -sL --max-time 60 -A "Mozilla/5.0" "https://open-epg.com" -o epg_data/tr2.xml.gz || true
          curl -sL --max-time 60 -A "Mozilla/5.0" "https://githubusercontent.com" -o epg_data/tr3.xml || true
          ls -lh epg_data/

      - name: Sade EPG Olustur ve Gist Guncelle
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python3 - << 'EOF'
          import os, glob, json, gzip, re, urllib.request, xml.etree.ElementTree as ET

          def ismi_sadelestir(isim):
              temiz = re.sub(r"\b(HD|FHD|UHD|4K|SD|HEVC|H265|RAW|TR|TURKEY|TV\+|\.tr)\b", "", isim, flags=re.IGNORECASE)
              temiz = re.sub(r"[\(\)\[\]\.\-_]", " ", temiz)
              return " ".join(temiz.split()).strip()

          ana_tv = ET.Element("tv", {"generator-info-name": "Sade-Turkiye-EPG"})
          eklenen_kanallar = {}
          id_haritasi = {}

          for dosya in glob.glob("epg_data/*"):
              try:
                  if os.path.getsize(dosya) < 1000:
                      print("Cok kucuk dosya atlandi:", dosya)
                      continue
                  with open(dosya, "rb") as f:
                      ham = f.read()
                  veri = gzip.decompress(ham) if dosya.endswith(".gz") else ham
                  
                  if not veri.lstrip().startswith(b"<"):
                      print("XML degil, atlandi:", dosya)
                      continue

                  kaynak_root = ET.fromstring(veri)

                  for ch in kaynak_root.findall("channel"):
                      eski_id = ch.get("id")
                      disp = ch.find("display-name")
                      ham_isim = disp.text if (disp is not None and disp.text) else eski_id
                      if not ham_isim:
                          continue
                      sade_ad = ismi_sadelestir(ham_isim)
                      if not sade_ad:
                          continue
                      id_haritasi[eski_id] = sade_ad
                      if sade_ad not in eklenen_kanallar:
                          yeni_ch = ET.SubElement(ana_tv, "channel", {"id": sade_ad})
                          yeni_disp = ET.SubElement(yeni_ch, "display-name", {"lang": "tr"})
                          yeni_disp.text = sade_ad
                          eklenen_kanallar[sade_ad] = True

                  for prog in kaynak_root.findall("programme"):
                      eski_ch_id = prog.get("channel")
                      if eski_ch_id in id_haritasi:
                          prog.set("channel", id_haritasi[eski_ch_id])
                          ana_tv.append(prog)

                  print("Islendi:", dosya, "| Toplam kanal:", len(eklenen_kanallar))
              except Exception as e:
                  print("Dosya hatasi:", dosya, e)

          xml_icerik = ET.tostring(ana_tv, encoding="utf-8", xml_declaration=True).decode("utf-8")

          ham_id = os.environ.get("GIST_ID", "").strip()
          gist_id = [parca for parca in ham_id.split("/") if parca][-1]
          gist_token = os.environ.get("GIST_TOKEN", "").strip()

          hedef_adres = "https://" + "://github.com" + gist_id
          print("Baglanilan Gist ID:", gist_id)

          payload = json.dumps({"files": {"guide.xml": {"content": xml_icerik}}}).encode("utf-8")
          gist_req = urllib.request.Request(hedef_adres, data=payload, method="PATCH", headers={
              "Authorization": "token " + gist_token,
              "Accept": "application/vnd.github.v3+json",
              "Content-Type": "application/json",
              "User-Agent": "EPG-Gist-Updater"
          })
          with urllib.request.urlopen(gist_req, timeout=60) as resp:
              print("Gist basariyla guncellendi! Durum:", resp.status)
          EOF
