name: Otomatik Gist Turkiye EPG

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  epg-uret:
    runs-on: ubuntu-latest
    steps:
      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Turkiye EPG Kaziyiciyi Hazirla
        run: |
          DOMAIN="github.com"
          REPO_PATH="iptv-org/epg.git"
          git clone --depth 1 "https://${DOMAIN}/${REPO_PATH}" epg_tool
          cd epg_tool
          npm install

      - name: Turkiye Kanallarini Cek
        run: |
          cd epg_tool
          cat sites/digiturk.com.tr/digiturk.com.tr.channels.xml sites/dsmart.com.tr/dsmart.com.tr.channels.xml | grep -E "<channel|<channels|</channels|<\?xml" > tr_all.xml
          echo '<?xml version="1.0" encoding="UTF-8"?><channels>' > temiz_kanallar.xml
          grep "<channel " tr_all.xml >> temiz_kanallar.xml || true
          echo '</channels>' >> temiz_kanallar.xml
          npm run grab -- --channels=temiz_kanallar.xml --output=../ham_guide.xml --days=2

      - name: Kanal Isimlerini Sadelestir
        run: |
          python3 - << 'EOF'
          import re, xml.etree.ElementTree as ET

          def ismi_sadelestir(isim):
              temiz = re.sub(r"\b(HD|FHD|UHD|4K|SD|HEVC|H265|RAW|TR|TURKEY|TV\+|\.tr)\b", "", isim, flags=re.IGNORECASE)
              temiz = re.sub(r"[\(\)\[\]\.\-_]", " ", temiz)
              return " ".join(temiz.split()).strip()

          kaynak_root = ET.parse("ham_guide.xml").getroot()
          ana_tv = ET.Element("tv", {"generator-info-name": "Sade-Turkiye-EPG"})
          eklenen_kanallar = {}
          id_haritasi = {}

          for ch in kaynak_root.findall("channel"):
              eski_id = ch.get("id")
              disp = ch.find("display-name")
              ham_isim = disp.text if (disp is not None and disp.text) else eski_id
              if not ham_isim:
                  continue
              sade_ad = ismi_sadelestir(ham_isim)
              if not sade_ad:
                  continue
              id_haritasi[eski_id] = sade_ad
              if sade_ad not in eklenen_kanallar:
                  yeni_ch = ET.SubElement(ana_tv, "channel", {"id": sade_ad})
                  yeni_disp = ET.SubElement(yeni_ch, "display-name", {"lang": "tr"})
                  yeni_disp.text = sade_ad
                  eklenen_kanallar[sade_ad] = True

          for prog in kaynak_root.findall("programme"):
              eski_ch_id = prog.get("channel")
              if eski_ch_id in id_haritasi:
                  prog.set("channel", id_haritasi[eski_ch_id])
                  ana_tv.append(prog)

          tree = ET.ElementTree(ana_tv)
          tree.write("guide.xml", encoding="utf-8", xml_declaration=True)
          print("Toplam sade kanal sayisi:", len(eklenen_kanallar))
          EOF

      - name: Gist Guncelle
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          CLEAN_ID=$(echo "$GIST_ID" | awk -F'/' '{print $NF}' | tr -d '[:space:]')
          gh gist edit "$CLEAN_ID" guide.xml
