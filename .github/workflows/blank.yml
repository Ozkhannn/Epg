name: Hizli ve Yedekli Turkiye EPG (Gist)

on:
  schedule:
    - cron: '0 2 * * *' # Her gün sabah 02:00'de çalışır
  workflow_dispatch: # İstediğiniz zaman manuel tetikleyebilirsiniz

jobs:
  epg-uret:
    runs-on: ubuntu-latest
    steps:
      - name: Python ve Kutuphaneleri Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Gerekli Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: TVYayinAkisi.com Uzerinden EPG Cek
        run: |
          python3 <<'PY'
          import requests
          from bs4 import BeautifulSoup
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta
          import re

          # M3U listenizdeki tvg-id'ler ile birebir eslesen kanal listesi
          # (Gerekirse buradaki slug'lari ve ID'leri kendi listenize gore guncelleyin)
