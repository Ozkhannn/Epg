name: Hizli ve Yedekli Turkiye EPG (Gist)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  epg-uret:
    runs-on: ubuntu-latest
    steps:
      - name: Node Kur
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Kaziyici Hazirla
        run: |
          git clone --depth 1 --single-branch "https://github.com/iptv-org/epg.git" epg_tool >/dev/null 2>&1
          cd epg_tool
          npm install --no-audit --no-fund --silent >/dev/null 2>&1

      - name: Yerli Kanallari Hizli Tara ve Cek
        run: |
          cd epg_tool
          python3 <<'PY'
          import re, xml.etree.ElementTree as ET

          HEDEF = {"trt1","trt2","trthaber","trtspor","trtsporyildiz","trtbelgesel","trtcocuk","trtmuzik","trtturk","trtavaz","trtkurdi","trtworld","kanald","eurod","kanalddrama","atv","atvahaber","a2","showtv","showturk","showmax","startv","eurostar","now","nowtv","fox","foxturk","tv8","tv85","tv8bucuk","kanal7","ulketv","beyaztv","teve2","tv4","360","tlc","dmax","cnbce","ekoltv","beinsports","beinsports1","beinsports2","beinsports3","beinsports4","beinsports5","beinsportsmax1","beinsportsmax2","beinsportshaber","tivibuspor","tivibuspor1","tivibuspor2","tivibuspor3","tivibuspor4","ssport","ssport1","ssport2","smartspor","smartspor1","smartspor2","eurosport1","eurosport2","aspor","htspor","sportstv","fbtv","ntv","cnnturk","haberturk","ahaber","anews","apara","bloomberght","ekoturk","halktv","sozcutv","tele1","krttv","haberglobal","24tv","tgrthaber","tgrteu","tgrtbelgesel","benguturk","tv100","akittv","liderhabertv","flashhaber","tytturk","nationalgeographic","natgeo","natgeowild","discoverychannel","discovery","bbcearth","bbcfirst","history","tarihtv","habitattv","minikago","minikacocuk","cartoonnetwork","disneyjunior","nickjr","nickelodeon","babytv","powerturk","powertv","kralpop","dreamturk","number1turk","number1tv"}

          def norm(m):
              s = str(m).translate(str.maketrans("çğıöşüÇĞİÖŞÜ", "cgiosuCGIOSU")).lower()
              s = re.sub(r"\b(hd|fhd|uhd|4k|sd|hevc|h265|raw|tr|turkey|tv\+|int|intl)\b", "", s)
              return re.sub(r"[^a-z0-9]", "", s)

          ALAN_ADLARI = ["tvplus.com.tr","blue.ch","digitalb.al","melita.com","tivibu.com.tr","trt.net.tr","kanald.com.tr","atv.com.tr","showtv.com.tr","star.com.tr","tv8.com.tr"]
          out = ET.Element("channels")
          for alan in ALAN_ADLARI:
              dosya = "sites/%s/%s.channels.xml" % (alan, alan)
              try:
                  for ch in ET.parse(dosya).getroot().findall("channel"):
                      if norm(ch.text or "") in HEDEF:
                          out.append(ch)
              except Exception:
                  pass
          ET.ElementTree(out).write("filtre.xml", encoding="utf-8", xml_declaration=True)
          print("Taranacak yerli kanal kaydi:", len(out))
          PY

          echo "=== GRAB BASLIYOR ==="
          npm run grab -- \
            --channels=filtre.xml \
            --output=../ham_guide.xml \
            --days=2 \
            --maxConnections=10 \
            --timeout=20000 2>&1 | grep -Ev "^\s*$" | tail -60 || true

          echo "=== GRAB BITTI ==="
          if [ -s ../ham_guide.xml ]; then
            HAM_CH=$(grep -o '<channel ' ../ham_guide.xml | wc -l)
            HAM_PR=$(grep -o '<programme ' ../ham_guide.xml | wc -l)
            echo "ham_guide.xml -> $HAM_CH kanal, $HAM_PR program"
          else
            echo "HATA: ham_guide.xml bos veya yok"
            exit 1
          fi

      - name: Yedekli TiviMate XML Olustur
        run: |
          python3 <<'PY'
          import re, xml.etree.ElementTree as ET

          # kanal_anahtar -> (tvg-id, gorunen ad)
          ADLAR = {
              "trt1": ("TRT1.tr", "TRT 1"),
              "trt2": ("TRT2.tr", "TRT 2"),
              "trthaber": ("TRTHaber.tr", "TRT Haber"),
              "trtspor": ("TRTSpor.tr", "TRT Spor"),
              "trtsporyildiz": ("TRTSporYildiz.tr", "TRT Spor Yıldız"),
              "trtbelgesel": ("TRTBelgesel.tr", "TRT Belgesel"),
              "trtcocuk": ("TRTCocuk.tr", "TRT Çocuk"),
              "trtmuzik": ("TRTMuzik.tr", "TRT Müzik"),
              "trtturk": ("TRTTurk.tr", "TRT Türk"),
              "trtavaz": ("TRTAvaz.tr", "TRT Avaz"),
              "trtkurdi": ("TRTKurdi.tr", "TRT Kurdi"),
              "trtworld": ("TRTWorld.tr", "TRT World"),
              "kanald": ("KanalD.tr", "Kanal D"),
              "eurod": ("EuroD.tr", "Euro D"),
              "kanalddrama": ("KanalDDrama.tr", "Kanal D Drama"),
              "atv": ("ATV.tr", "ATV"),
              "a2": ("A2.tr", "A2"),
              "showtv": ("ShowTV.tr", "Show TV"),
              "showturk": ("ShowTurk.tr", "Show Türk"),
              "showmax": ("ShowMax.tr", "Show Max"),
              "startv": ("StarTV.tr", "Star TV"),
              "eurostar": ("EuroStar.tr", "Euro Star"),
              "now": ("NOW.tr", "NOW"),
              "nowtv": ("NOW.tr", "NOW"),
              "fox": ("NOW.tr", "NOW"),
              "tv8": ("TV8.tr", "TV8"),
              "tv85": ("TV85.tr", "TV8,5"),
              "tv8bucuk": ("TV85.tr", "TV8,5"),
              "kanal7": ("Kanal7.tr", "Kanal 7"),
              "ulketv": ("UlkeTV.tr", "Ülke TV"),
              "beyaztv": ("BeyazTV.tr", "Beyaz TV"),
              "teve2": ("Teve2.tr", "Teve2"),
              "tv4": ("TV4.tr", "TV 4"),
              "360": ("360.tr", "360"),
              "tlc": ("TLC.tr", "TLC"),
              "dmax": ("DMAX.tr", "DMAX"),
              "cnbce": ("CNBCe.tr", "CNBC-e"),
              "ekoltv": ("EkolTV.tr", "Ekol TV"),
              "beinsports": ("beINSports1.tr", "beIN Sports 1"),
              "beinsports1": ("beINSports1.tr", "beIN Sports 1"),
              "beinsports2": ("beINSports2.tr", "beIN Sports 2"),
              "beinsports3": ("beINSports3.tr", "beIN Sports 3"),
              "beinsports4": ("beINSports4.tr", "beIN Sports 4"),
              "beinsports5": ("beINSports5.tr", "beIN Sports 5"),
              "beinsportsmax1": ("beINSportsMAX1.tr", "beIN Sports MAX 1"),
              "beinsportsmax2": ("beINSportsMAX2.tr", "beIN Sports MAX 2"),
              "beinsportshaber": ("beINSportsHaber.tr", "beIN Sports Haber"),
              "tivibuspor": ("TivibuSpor.tr", "Tivibu Spor"),
              "tivibuspor1": ("TivibuSpor1.tr", "Tivibu Spor 1"),
              "tivibuspor2": ("TivibuSpor2.tr", "Tivibu Spor 2"),
              "tivibuspor3": ("TivibuSpor3.tr", "Tivibu Spor 3"),
              "tivibuspor4": ("TivibuSpor4.tr", "Tivibu Spor 4"),
              "ssport": ("SSport.tr", "S Sport"),
              "ssport1": ("SSport1.tr", "S Sport 1"),
              "ssport2": ("SSport2.tr", "S Sport 2"),
              "smartspor": ("SmartSpor.tr", "Smart Spor"),
              "smartspor1": ("SmartSpor1.tr", "Smart Spor 1"),
              "smartspor2": ("SmartSpor2.tr", "Smart Spor 2"),
              "eurosport1": ("Eurosport1.tr", "Eurosport 1"),
              "eurosport2": ("Eurosport2.tr", "Eurosport 2"),
              "aspor": ("ASpor.tr", "A Spor"),
              "htspor": ("HTSpor.tr", "HT Spor"),
              "sportstv": ("SportsTV.tr", "Sports TV"),
              "fbtv": ("FBTV.tr", "FB TV"),
              "ntv": ("NTV.tr", "NTV"),
              "cnnturk": ("CNNTurk.tr", "CNN Türk"),
              "haberturk": ("Haberturk.tr", "Habertürk"),
              "ahaber": ("AHaber.tr", "A Haber"),
              "anews": ("ANews.tr", "A News"),
              "apara": ("APara.tr", "A Para"),
              "bloomberght": ("BloombergHT.tr", "Bloomberg HT"),
              "ekoturk": ("Ekoturk.tr", "Ekotürk"),
              "halktv": ("HalkTV.tr", "Halk TV"),
              "sozcutv": ("SozcuTV.tr", "Sözcü TV"),
              "tele1": ("Tele1.tr", "Tele1"),
              "krttv": ("KRTTV.tr", "KRT TV"),
              "haberglobal": ("HaberGlobal.tr", "Haber Global"),
              "24tv": ("24TV.tr", "24 TV"),
              "tgrthaber": ("TGRTHaber.tr", "TGRT Haber"),
              "tgrteu": ("TGRTEU.tr", "TGRT EU"),
              "tgrtbelgesel": ("TGRTBelgesel.tr", "TGRT Belgesel"),
              "benguturk": ("Benguturk.tr", "Bengütürk"),
              "tv100": ("TV100.tr", "TV100"),
              "akittv": ("AkitTV.tr", "Akit TV"),
              "liderhabertv": ("LiderHaber.tr", "Lider Haber"),
              "flashhaber": ("FlashHaber.tr", "Flash Haber"),
              "tytturk": ("TYTTurk.tr", "TYT Türk"),
              "nationalgeographic": ("NationalGeographic.tr", "National Geographic"),
              "natgeo": ("NationalGeographic.tr", "National Geographic"),
              "natgeowild": ("NatGeoWild.tr", "Nat Geo Wild"),
              "discoverychannel": ("DiscoveryChannel.tr", "Discovery Channel"),
              "discovery": ("DiscoveryChannel.tr", "Discovery Channel"),
              "bbcearth": ("BBCEarth.tr", "BBC Earth"),
              "bbcfirst": ("BBCFirst.tr", "BBC First"),
              "history": ("History.tr", "History"),
              "tarihtv": ("TarihTV.tr", "Tarih TV"),
              "habitattv": ("HabitatTV.tr", "Habitat TV"),
              "minikago": ("MinikaGO.tr", "MinikaGO"),
              "minikacocuk": ("MinikaCocuk.tr", "Minika Çocuk"),
              "cartoonnetwork": ("CartoonNetwork.tr", "Cartoon Network"),
              "disneyjunior": ("DisneyJunior.tr", "Disney Junior"),
              "nickjr": ("NickJr.tr", "Nick Jr"),
              "nickelodeon": ("Nickelodeon.tr", "Nickelodeon"),
              "babytv": ("BabyTV.tr", "Baby TV"),
              "powerturk": ("PowerTurk.tr", "Power Türk"),
              "powertv": ("PowerTV.tr", "Power TV"),
              "kralpop": ("KralPop.tr", "Kral Pop"),
              "dreamturk": ("DreamTurk.tr", "Dream Türk"),
              "number1turk": ("Number1Turk.tr", "Number1 Türk"),
              "number1tv": ("Number1TV.tr", "Number1 TV"),
          }

          def temiz(s):
              return re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]", "", s or "").strip()

          def norm(m):
              s = str(m).translate(str.maketrans("çğıöşüÇĞİÖŞÜ", "cgiosuCGIOSU")).lower()
              s = re.sub(r"\b(hd|fhd|uhd|4k|sd|hevc|h265|raw|tr|turkey|tv\+|int|intl)\b", "", s)
              return re.sub(r"[^a-z0-9]", "", s)

          def saat_ekle(z):
              if not z or len(z) < 14:
                  return z
              if z[14:].strip().startswith(("+", "-")):
                  return z
              return z[:14] + " +0300"

          # 1) Beklenen tum kanallari filtre.xml'den al
          #    -> grab sadece 8 kanal ceksе bile 104 kanal XML'de yer alir
          id_map = {}       # xmltv_id -> tid
          kanallar = {}     # tid -> gorunen ad

          filtre_kok = ET.parse("filtre.xml").getroot()
          for ch in filtre_kok.findall("channel"):
              eid = ch.get("xmltv_id")
              if not eid:
                  continue
              ham = ch.text or ""
              n = norm(ham)
              if n in ADLAR:
                  tid, gad = ADLAR[n]
                  id_map[eid] = tid
                  kanallar[tid] = gad

          print("Beklenen kanal (filtre.xml):", len(kanallar))

          # 2) Programlari ham_guide.xml'den al ve id_map uzerinden esle
          kok = ET.parse("ham_guide.xml").getroot()
          proglar = []
          eklenen = set()
          programli = set()

          for p in kok.findall("programme"):
              eid = p.get("channel")
              tid = id_map.get(eid)
              if not tid:
                  continue
              b_el = p.find("title")
              if b_el is None or not b_el.text or not b_el.text.strip():
                  continue
              st = saat_ekle(p.get("start", ""))
              sp = saat_ekle(p.get("stop", ""))
              if not st or not sp or (tid, st) in eklenen:
                  continue
              eklenen.add((tid, st))
              yp = ET.Element("programme", {"start": st, "stop": sp, "channel": tid})
              ET.SubElement(yp, "title", {"lang": "tr"}).text = temiz(b_el.text)
              de = p.find("desc")
              if de is not None and de.text:
                  ET.SubElement(yp, "desc", {"lang": "tr"}).text = temiz(de.text)
              proglar.append(yp)
              programli.add(tid)

          # 3) XML'i yaz — TUM kanallar (program olsun veya olmasin)
          tv = ET.Element("tv", {"generator-info-name": "Yedekli-Turkiye-EPG"})
          for tid, gad in sorted(kanallar.items()):
              yc = ET.SubElement(tv, "channel", {"id": tid})
              ET.SubElement(yc, "display-name", {"lang": "tr"}).text = gad
          for yp in proglar:
              tv.append(yp)
          ET.ElementTree(tv).write("guide.xml", encoding="utf-8", xml_declaration=True)

          # Tanilama ciktisi
          programsiz = set(kanallar.keys()) - programli
          print("OZET -> Toplam kanal: %d | Programli: %d | Programsiz: %d | Toplam program: %d"
                % (len(kanallar), len(programli), len(programsiz), len(proglar)))
          if programsiz:
              print("Programsiz ilk 15 kanal:", sorted(programsiz)[:15])
          PY

      - name: Gist Guncelle
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          CLEAN_ID=$(echo "$GIST_ID" | awk -F'/' '{print $NF}' | tr -d '[:space:]')
          jq -n --rawfile content guide.xml '{files: {"guide.xml": {content: $content}}}' | \
            gh api -X PATCH /gists/"$CLEAN_ID" --input -
