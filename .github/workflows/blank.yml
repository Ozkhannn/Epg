              "tv8-5-yayin-akisi": ("TV85.tr", "TV8,5"),
              "kanal-7-yayin-akisi": ("Kanal7.tr", "Kanal 7"),
              "ulke-tv-yayin-akisi": ("UlkeTV.tr", "Ülke TV"),
              "beyaz-tv-yayin-akisi": ("BeyazTV.tr", "Beyaz TV"),
              "teve2-yayin-akisi": ("Teve2.tr", "Teve2"),
              "tv4-yayin-akisi": ("TV4.tr", "TV 4"),
              "360-yayin-akisi": ("360.tr", "360"),
              "tlc-yayin-akisi": ("TLC.tr", "TLC"),
              "dmax-yayin-akisi": ("DMAX.tr", "DMAX"),
              "cnbc-e-yayin-akisi": ("CNBCe.tr", "CNBC-e"),
              "ekol-tv-yayin-akisi": ("EkolTV.tr", "Ekol TV"),
              "beinsports-1-yayin-akisi": ("beINSports1.tr", "beIN Sports 1"),
              "beinsports-2-yayin-akisi": ("beINSports2.tr", "beIN Sports 2"),
              "beinsports-3-yayin-akisi": ("beINSports3.tr", "beIN Sports 3"),
              "beinsports-4-yayin-akisi": ("beINSports4.tr", "beIN Sports 4"),
              "beinsports-5-yayin-akisi": ("beINSports5.tr", "beIN Sports 5"),
              "beinsports-max-1-yayin-akisi": ("beINSportsMAX1.tr", "beIN Sports MAX 1"),
              "beinsports-max-2-yayin-akisi": ("beINSportsMAX2.tr", "beIN Sports MAX 2"),
              "beinsports-haber-yayin-akisi": ("beINSportsHaber.tr", "beIN Sports Haber"),
              "tivibuspor-yayin-akisi": ("TivibuSpor.tr", "Tivibu Spor"),
              "tivibuspor-1-yayin-akisi": ("TivibuSpor1.tr", "Tivibu Spor 1"),
              "tivibuspor-2-yayin-akisi": ("TivibuSpor2.tr", "Tivibu Spor 2"),
              "tivibuspor-3-yayin-akisi": ("TivibuSpor3.tr", "Tivibu Spor 3"),
              "tivibuspor-4-yayin-akisi": ("TivibuSpor4.tr", "Tivibu Spor 4"),
              "s-sport-yayin-akisi": ("SSport.tr", "S Sport"),
              "s-sport-1-yayin-akisi": ("SSport1.tr", "S Sport 1"),
              "s-sport-2-yayin-akisi": ("SSport2.tr", "S Sport 2"),
              "smart-spor-yayin-akisi": ("SmartSpor.tr", "Smart Spor"),
              "smart-spor-1-yayin-akisi": ("SmartSpor1.tr", "Smart Spor 1"),
              "smart-spor-2-yayin-akisi": ("SmartSpor2.tr", "Smart Spor 2"),
              "eurosport-1-yayin-akisi": ("Eurosport1.tr", "Eurosport 1"),
              "eurosport-2-yayin-akisi": ("Eurosport2.tr", "Eurosport 2"),
              "a-spor-yayin-akisi": ("ASpor.tr", "A Spor"),
              "ht-spor-yayin-akisi": ("HTSpor.tr", "HT Spor"),
              "sports-tv-yayin-akisi": ("SportsTV.tr", "Sports TV"),
              "fb-tv-yayin-akisi": ("FBTV.tr", "FB TV"),
              "ntv-yayin-akisi": ("NTV.tr", "NTV"),
              "cnn-turk-yayin-akisi": ("CNNTurk.tr", "CNN Türk"),
              "haberturk-yayin-akisi": ("Haberturk.tr", "Habertürk"),
              "a-haber-yayin-akisi": ("AHaber.tr", "A Haber"),
              "a-news-yayin-akisi": ("ANews.tr", "A News"),
              "a-para-yayin-akisi": ("APara.tr", "A Para"),
              "bloomberg-ht-yayin-akisi": ("BloombergHT.tr", "Bloomberg HT"),
              "ekoturk-yayin-akisi": ("Ekoturk.tr", "Ekotürk"),
              "halk-tv-yayin-akisi": ("HalkTV.tr", "Halk TV"),
              "sozcu-tv-yayin-akisi": ("SozcuTV.tr", "Sözcü TV"),
              "tele1-yayin-akisi": ("Tele1.tr", "Tele1"),
              "krt-tv-yayin-akisi": ("KRTTV.tr", "KRT TV"),
              "haber-global-yayin-akisi": ("HaberGlobal.tr", "Haber Global"),
              "24-tv-yayin-akisi": ("24TV.tr", "24 TV"),
              "tgrt-haber-yayin-akisi": ("TGRTHaber.tr", "TGRT Haber"),
              "tgrt-eu-yayin-akisi": ("TGRTEU.tr", "TGRT EU"),
              "tgrt-belgesel-yayin-akisi": ("TGRTBelgesel.tr", "TGRT Belgesel"),
              "benguturk-yayin-akisi": ("Benguturk.tr", "Bengütürk"),
              "tv100-yayin-akisi": ("TV100.tr", "TV100"),
              "akit-tv-yayin-akisi": ("AkitTV.tr", "Akit TV"),
              "lider-haber-yayin-akisi": ("LiderHaber.tr", "Lider Haber"),
              "flash-haber-yayin-akisi": ("FlashHaber.tr", "Flash Haber"),
              "tyt-turk-yayin-akisi": ("TYTTurk.tr", "TYT Türk"),
              "national-geographic-yayin-akisi": ("NationalGeographic.tr", "National Geographic"),
              "nat-geo-wild-yayin-akisi": ("NatGeoWild.tr", "Nat Geo Wild"),
              "discovery-channel-yayin-akisi": ("DiscoveryChannel.tr", "Discovery Channel"),
              "bbc-earth-yayin-akisi": ("BBCEarth.tr", "BBC Earth"),
              "bbc-first-yayin-akisi": ("BBCFirst.tr", "BBC First"),
              "history-yayin-akisi": ("History.tr", "History"),
              "tarih-tv-yayin-akisi": ("TarihTV.tr", "Tarih TV"),
              "habitat-tv-yayin-akisi": ("HabitatTV.tr", "Habitat TV"),
              "minika-go-yayin-akisi": ("MinikaGO.tr", "MinikaGO"),
              "minika-cocuk-yayin-akisi": ("MinikaCocuk.tr", "Minika Çocuk"),
              "cartoon-network-yayin-akisi": ("CartoonNetwork.tr", "Cartoon Network"),
              "disney-junior-yayin-akisi": ("DisneyJunior.tr", "Disney Junior"),
              "nick-jr-yayin-akisi": ("NickJr.tr", "Nick Jr"),
              "nickelodeon-yayin-akisi": ("Nickelodeon.tr", "Nickelodeon"),
              "baby-tv-yayin-akisi": ("BabyTV.tr", "Baby TV"),
              "power-turk-yayin-akisi": ("PowerTurk.tr", "Power Türk"),
              "power-tv-yayin-akisi": ("PowerTV.tr", "Power TV"),
              "kral-pop-yayin-akisi": ("KralPop.tr", "Kral Pop"),
              "dream-turk-yayin-akisi": ("DreamTurk.tr", "Dream Türk"),
              "number1-turk-yayin-akisi": ("Number1Turk.tr", "Number1 Türk"),
              "number1-tv-yayin-akisi": ("Number1TV.tr", "Number1 TV"),
          }

          def temiz(s):
              return re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]", "", s or "").strip()

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          proglar = []
          kanallar = {}
          
          bugun = datetime.utcnow() + timedelta(hours=3) # TRT (UTC+3)
          yarin = bugun + timedelta(days=1)
          
          print("=== TVYAYINAKISI.COM KAZIMA BASLIYOR ===")

          for slug, (tvg_id, gorunen_ad) in KANALLAR.items():
              kanallar[tvg_id] = gorunen_ad
              url = f"https://www.tvyayinakisi.com/{slug}/"
              try:
                  r = requests.get(url, headers=headers, timeout=15)
                  if r.status_code != 200:
                      print(f"[{tvg_id}] HTTP {r.status_code} - Atlandi")
                      continue
                  
                  soup = BeautifulSoup(r.text, "html.parser")
                  # Sitedeki program listesi yapisini bulma (Genel bir yaklasim)
                  # Not: Site yapisi degisirse bu kisim guncellenmelidir.
                  # Ornek: <div class="yayin-akisi-listesi"> <li> <time>08:00</time> <span>Program</span> </li> ...
                  
                  # Programlari cek (Basit bir metin tabanli yaklasim)
                  # Site uzerindeki saat ve program adi iceren etiketleri ariyoruz
                  # Simdilik sayfadaki tum metni alip basit bir regex ile ayiklayacagiz
                  
                  # NOT: Asagidaki parsing kismi sitenin gercek HTML yapisina gore 
                  # (ornegin <table> veya <div class="...">) daha da netlestirilmelidir.
                  # Su anki kod, ornek bir yapiyi hedefler.
                  
                  metin = soup.get_text()
                  # "HH:MM" formatindaki saatleri ve ardindan gelen program isimlerini ariyoruz
                  matches = re.findall(r'(\d{2}:\d{2})\s*\n\s*([^\n]+)', metin)
                  
                  if not matches:
                      print(f"[{tvg_id}] Program bulunamadi (HTML yapisi farkli olabilir)")
                      continue

                  eklenen_saatler = set()
                  for saat_str, program_adi in matches:
                      try:
                          saat, dakika = map(int, saat_str.split(':'))
                          # Saat 00:00-05:59 arasi ise ertesi gune at
                          baz_tarih = bugun if saat >= 6 else yarin
                          baslangic = baz_tarih.replace(hour=saat, minute=dakika, second=0, microsecond=0)
                          bitis = baslangic + timedelta(minutes=60) # Varsayilan 1 saat
                          
                          st = baslangic.strftime("%Y%m%d%H%M%S") + " +0300"
                          sp = bitis.strftime("%Y%m%d%H%M%S") + " +0300"
                          
                          if (tvg_id, st) in eklenen_saatler:
                              continue
                          eklenen_saatler.add((tvg_id, st))

                          yp = ET.Element("programme", {"start": st, "stop": sp, "channel": tvg_id})
                          ET.SubElement(yp, "title", {"lang": "tr"}).text = temiz(program_adi)
                          proglar.append(yp)
                      except Exception:
                          pass
                          
                  print(f"[{tvg_id}] Basariyla tarandi. ({len(matches)} program)")

              except Exception as e:
                  print(f"[{tvg_id}] Hata: {e}")

          # XML'i olustur
          tv = ET.Element("tv", {"generator-info-name": "TVYayinAkisi-Scraper"})
          for tid, gad in sorted(kanallar.items()):
              yc = ET.SubElement(tv, "channel", {"id": tid})
              ET.SubElement(yc, "display-name", {"lang": "tr"}).text = gad
          
          for yp in proglar:
              tv.append(yp)
              
          ET.ElementTree(tv).write("guide.xml", encoding="utf-8", xml_declaration=True)

          print(f"OZET -> Toplam kanal: {len(kanallar)} | Toplam program: {len(proglar)}")
          PY

      - name: Gist Guncelle ve Dogrula
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          CLEAN_ID=$(echo "$GIST_ID" | awk -F'/' '{print $NF}' | tr -d '[:space:]')
          # Gist'e yukle
          jq -n --rawfile content guide.xml '{files: {"guide.xml": {content: $content}}}' | \
            gh api -X PATCH /gists/"$CLEAN_ID" --input - > /dev/null
          
          # Dogrulama
          echo "=== GIST DOGRULAMA ==="
          FIRST_LINE=$(gh api /gists/"$CLEAN_ID" --jq '.files["guide.xml"].content' | head -n 1)
          echo "Gist'teki ilk satir: $FIRST_LINE"
          if [[ "$FIRST_LINE" != "<?xml"* ]]; then
            echo "HATA: Gist guncellenemedi!"
            exit 1
          fi
          echo "BASARILI: Gist guncellendi."
