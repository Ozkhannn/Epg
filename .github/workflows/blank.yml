name: Hizli ve Tam Turkiye EPG (Gist)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  epg-uret:
    runs-on: ubuntu-latest
    steps:
      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kaziyiciyi Hizli Hazirla
        run: |
          DOMAIN="github.com"
          REPO_PATH="iptv-org/epg.git"
          git clone --depth 1 --single-branch "https://${DOMAIN}/${REPO_PATH}" epg_tool >/dev/null 2>&1
          cd epg_tool
          npm install --omit=dev --no-audit --no-fund --silent >/dev/null 2>&1

      - name: Calisan Turkiye Kaynaklarini Cek
        run: |
          cd epg_tool
          mkdir -p ../kaynak_ciktilari

          SITELER="tvplus.com.tr tivibu.com.tr digiturk.com.tr dsmart.com.tr trt.net.tr kanald.com.tr showtv.com.tr atv.com.tr star.com.tr tv8.com.tr teleboy.ch"

          for site_adi in $SITELER; do
            dosya="sites/${site_adi}/${site_adi}.channels.xml"
            if [ -f "$dosya" ]; then
              echo '<?xml version="1.0" encoding="UTF-8"?><channels>' > temp_ch.xml
              grep 'lang="tr"' "$dosya" | grep "<channel " >> temp_ch.xml || true
              echo '</channels>' >> temp_ch.xml

              kanal_sayisi=$(grep -c '<channel ' temp_ch.xml || true)
              if [ "$kanal_sayisi" -gt 0 ]; then
                npm run grab -- --channels=temp_ch.xml --output="../kaynak_ciktilari/${site_adi}.xml" --days=2 --maxConnections=15 --timeout=12000 >/dev/null 2>&1 || true
                
                if [ -f "../kaynak_ciktilari/${site_adi}.xml" ]; then
                  prog_sayisi=$(grep -c '<programme ' "../kaynak_ciktilari/${site_adi}.xml" || true)
                  aktif_ch=$(grep -o 'channel="[^"]*"' "../kaynak_ciktilari/${site_adi}.xml" | sort -u | wc -l || true)
                  echo "Kaynak: ${site_adi} -> ${aktif_ch} kanal, ${prog_sayisi} program geldi."
                else
                  echo "Kaynak: ${site_adi} -> 0 kanal, 0 program geldi."
                fi
              fi
            fi
          done

      - name: TiviMate Uyumlu XML Olustur
        run: |
          python3 - << 'EOF'
          import glob, re, xml.etree.ElementTree as ET

          def ismi_sadelestir(isim):
              temiz = re.sub(r"\b(HD|FHD|UHD|4K|SD|HEVC|H265|RAW|TR|TURKEY|TV\+|\.tr|Int'l|Int)\b", "", isim, flags=re.IGNORECASE)
              temiz = re.sub(r"[\(\)\[\]\.\-_]", " ", temiz)
              temiz = " ".join(temiz.split()).strip()
              sozluk = {
                  "a spor": "A Spor", "a para": "A Para", "a haber": "A Haber",
                  "haberturk": "Habertürk", "haber turk": "Habertürk", "haber türk": "Habertürk",
                  "show turk": "Show Türk", "show türk": "Show Türk", "showturk": "Show Türk",
                  "showmax": "Show Max", "show max": "Show Max",
                  "trt turk": "TRT Türk", "trt türk": "TRT Türk",
                  "power turk": "Power Türk", "power türk": "Power Türk",
                  "eurostar": "Euro Star", "euro star": "Euro Star",
                  "tv4": "TV 4", "tv 4": "TV 4",
                  "24": "24 TV", "24 tv": "24 TV"
              }
              return sozluk.get(temiz.lower(), temiz)

          aktif_kanallar = set()
          eklenen_programlar = set()
          program_elemanlari = []

          for xml_dosya in glob.glob("kaynak_ciktilari/*.xml"):
              try:
                  kaynak_root = ET.parse(xml_dosya).getroot()
                  id_haritasi = {}

                  for ch in kaynak_root.findall("channel"):
                      eski_id = ch.get("id")
                      disp = ch.find("display-name")
                      ham_isim = disp.text if (disp is not None and disp.text) else eski_id
                      if ham_isim:
                          sade_ad = ismi_sadelestir(ham_isim)
                          if sade_ad:
                              id_haritasi[eski_id] = sade_ad

                  for prog in kaynak_root.findall("programme"):
                      eski_ch_id = prog.get("channel")
                      if eski_ch_id in id_haritasi:
                          sade_ad = id_haritasi[eski_ch_id]
                          baslik_el = prog.find("title")
                          baslik = baslik_el.text if (baslik_el is not None and baslik_el.text) else ""
                          if sade_ad == "TV 4" and any(k in baslik for k in ["Policjantki", "Trudne", "Disco", "Telezakupy"]):
                              continue
                          baslangic = prog.get("start", "")
                          anahtar = (sade_ad, baslangic)
                          if anahtar not in eklenen_programlar:
                              eklenen_programlar.add(anahtar)
                              prog.set("channel", sade_ad)
                              program_elemanlari.append(prog)
                              aktif_kanallar.add(sade_ad)
              except Exception:
                  pass

          # TiviMate standartlarina uygun olarak ONCE <channel>, SONRA <programme> eklenir
          ana_tv = ET.Element("tv", {"generator-info-name": "Sade-Turkiye-EPG"})
          for sade_ad in sorted(aktif_kanallar):
              yeni_ch = ET.SubElement(ana_tv, "channel", {"id": sade_ad})
              yeni_disp = ET.SubElement(yeni_ch, "display-name", {"lang": "tr"})
              yeni_disp.text = sade_ad

          for prog in program_elemanlari:
              ana_tv.append(prog)

          tree = ET.ElementTree(ana_tv)
          tree.write("guide.xml", encoding="utf-8", xml_declaration=True)
          print(f"OZET -> Toplam benzersiz kanal: {len(aktif_kanallar)} | Toplam tekil program: {len(program_elemanlari)}")
          EOF

      - name: Gist Guncelle
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          CLEAN_ID=$(echo "$GIST_ID" | awk -F'/' '{print $NF}' | tr -d '[:space:]')
          gh gist edit "$CLEAN_ID" guide.xml
